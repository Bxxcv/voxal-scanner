<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demo review keamanan dengan skenario sintetis dan saran remediasi.">
    <title>VOCXAL | Demo Review Keamanan</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/scanner.js"></script>
</head>
<body>
    <header class="navbar">
        <nav class="nav-container" aria-label="Navigasi utama">
            <a class="logo" href="index.html">VOCXAL</a>
            <a class="text-link" href="dashboard.html">Dashboard</a>
        </nav>
    </header>
    <main class="page home">
        <div class="page-heading">
            <p class="eyebrow">DEMO · DATA SINTETIS</p>
            <h1>Review keamanan, dari temuan ke remediasi.</h1>
            <p>Pelajari cara membaca temuan dan menentukan langkah perbaikan. Demo ini tidak memindai situs atau perangkat apa pun.</p>
        </div>
        <section class="scanner-card" aria-labelledby="scenario-title">
            <h2 id="scenario-title">Pilih skenario</h2>
            <form action="report.html" method="get">
                <label for="scenario">Skenario contoh</label>
                <select name="scenario" id="scenario" required>
                    <option value="">Pilih satu skenario</option>
                </select>
                <button id="open-report" class="scan-btn" type="submit" disabled>Buka laporan</button>
            </form>
            <noscript><p>Aktifkan JavaScript untuk membuka laporan demo.</p></noscript>
        </section>
    </main>
</body>
</html>
